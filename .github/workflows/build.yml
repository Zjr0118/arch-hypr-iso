name: Build Arch Hyprland ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO inside archlinux:base-devel container
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}/profile:/profile" \
            -v "${GITHUB_WORKSPACE}/out:/out" \
            -w /work \
            archlinux:base-devel \
            bash -c '
              set -euxo pipefail
              pacman-key --init
              pacman-key --populate archlinux
              printf "Server = https://mirrors.aliyun.com/archlinux/\$repo/os/\$arch\nServer = https://mirrors.tuna.tsinghua.edu.cn/archlinux/\$repo/os/\$arch\n" > /etc/pacman.d/mirrorlist
              pacman -Syu --noconfirm --needed archiso rsync
              rsync -a /usr/share/archiso/configs/releng/syslinux/ /profile/syslinux/
              rsync -a /usr/share/archiso/configs/releng/efiboot/ /profile/efiboot/
              mkarchiso -v -w /work -o /out /profile
            '

      - name: Split ISO into <2GB chunks (GitHub Release asset limit)
        run: |
          cd out
          ISO=$(ls *.iso | head -1)
          split -b 1800M -d "${ISO}" "${ISO}.part-"
          rm -f "${ISO}"
          ls -lh

      - name: Upload chunks to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Arch Hyprland ISO
          files: out/*.iso.part-*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
